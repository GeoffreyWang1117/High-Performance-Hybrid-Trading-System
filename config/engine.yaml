# Titans Engine Configuration

engine:
  mode: shadow              # shadow, replay, backtest
  threads: 4                # Number of worker threads

symbols:
  - BTCUSDT
  - ETHUSDT

market_data:
  source: binance           # binance, simulation
  websocket:
    host: stream.binance.com
    port: 9443
    path: /ws
    use_ssl: true
    ping_interval_ms: 30000
    reconnect_delay_ms: 5000

logging:
  level: info               # debug, info, warn, error
  path: ./data/logs
  binary_log: true
  max_file_size_mb: 1024
  rotate_count: 10

risk:
  max_position_size: 10.0
  max_order_size: 1.0
  max_orders_per_second: 10
  max_orders_per_minute: 100
  max_daily_loss_usd: 1000.0
  max_drawdown_pct: 5.0
  max_gross_exposure_usd: 200000.0
  max_net_exposure_usd: 50000.0

shadow:
  simulated_latency_ms: 10
  slippage_bps: 5.0
  commission_bps: 10.0
  record_latency: true

cuda:
  enabled: true
  device_id: 0
  batch_size: 1024

llm:
  enabled: true
  provider: ollama          # ollama, llamacpp
  url: http://localhost:11434
  model: llama3
  timeout_seconds: 60

performance:
  memory_pool_size_mb: 256
  event_queue_size: 65536
  order_book_depth: 20
