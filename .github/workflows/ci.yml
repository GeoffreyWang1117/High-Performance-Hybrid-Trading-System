name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DTITANS_ENABLE_CUDA=OFF \
            -DTITANS_ENABLE_TESTS=ON \
            -DTITANS_ENABLE_BENCHMARKS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: cd build && ctest --output-on-failure

      - name: Run experiment suite (smoke)
        # Runs in seconds; catches runtime regressions in the research
        # pipeline, not just compile breaks.
        run: ./build/titans_experiment > /dev/null

      - name: titans_llm_experiment refuses to run without a backend
        # The single most important behaviour of this binary is that it does
        # NOT fall back to a stand-in when no model is reachable. A silent
        # fallback would emit clean-looking numbers from a model that was never
        # queried, which is exactly the defect this repository was rebuilt to
        # remove. Assert the refusal.
        run: |
          set +e
          out=$(./build/titans_llm_experiment --backend vllm --port 59999 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::llm experiment exited 0 with no backend reachable"
            exit 1
          fi
          echo "$out" | grep -q "will not fall back to a stand-in" || {
            echo "::error::refusal message changed; check the fallback path"
            exit 1
          }

      - name: Figure generation refuses to fabricate data
        # generate_figures.py used to synthesize np.random results when no
        # experiment output existed, producing publication-ready figures from
        # nothing. Assert that it now fails instead.
        run: |
          python3 -m pip install --quiet pandas numpy matplotlib seaborn
          set +e
          python3 python/research/generate_figures.py --results /nonexistent 2>&1 | tee /tmp/fig.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::figure generation succeeded with no results present"
            exit 1
          fi
          grep -q "no synthetic fallback" /tmp/fig.log

  thread-sanitizer:
    # The advisory slot is lock-free and single-writer/multi-reader. Its first
    # implementation was a seqlock that tore 414 times in 2.8M reads, so this
    # code gets a dedicated race detector run rather than relying on the
    # functional test alone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build

      - name: Build with ThreadSanitizer
        run: |
          cmake -B build-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1" \
            -DTITANS_ENABLE_CUDA=OFF \
            -DTITANS_ENABLE_TESTS=ON \
            -DTITANS_ENABLE_BENCHMARKS=OFF
          cmake --build build-tsan --parallel

      - name: Run concurrency tests under TSan
        env:
          # AdvisorySlot::try_read may copy a ring slot the writer is
          # overwriting, in the lapped case. That copy is DISCARDED -- the
          # generation re-read detects it -- but TSan cannot see the discard and
          # reports the access. This is the standard seqlock-family trade, also
          # made by the Linux kernel, folly, and Rust's seqlock crate.
          #
          # Correctness of the discard is established by
          # test_advisory_slot_never_tears (0 torn reads in 2.56M under an
          # adversarial writer), not by TSan. Everything else must be clean.
          TSAN_OPTIONS: "suppressions=.github/tsan.supp halt_on_error=0 second_deadlock_stack=1"
        run: ./build-tsan/tests/titans_tests

  address-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build

      - name: Build with ASan + UBSan
        run: |
          cmake -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1" \
            -DTITANS_ENABLE_CUDA=OFF \
            -DTITANS_ENABLE_TESTS=ON \
            -DTITANS_ENABLE_BENCHMARKS=OFF
          cmake --build build-asan --parallel

      - name: Run tests under ASan/UBSan
        env:
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: ./build-asan/tests/titans_tests

  benchmark-self-check:
    # The benchmark's own calibration check must pass. CI runners are noisy and
    # often virtualized, so the wall-clock numbers here are meaningless -- what
    # is being verified is that the harness still resolves a known-cost
    # operation correctly and exits non-zero when it cannot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build
      - name: Build benchmarks
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DTITANS_ENABLE_CUDA=OFF -DTITANS_ENABLE_TESTS=OFF
          cmake --build build --parallel --target titans_benchmark
      - name: Harness self-check
        run: ./build/titans_benchmark --quick --json /tmp/bench.json
      - name: Results file records what was not controlled
        # A results file without its caveats is a results file nobody can
        # weigh. Assert the fingerprint made it in.
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('/tmp/bench.json'))
          m = d['machine']
          assert 'caveats' in m, "no caveats recorded"
          assert m['cpu_model'], "no cpu model recorded"
          assert m['compiler'], "no compiler recorded"
          for r in d['results']:
              if r['mode'] == 'amortized':
                  assert not r['has_distribution'], \
                      f"{r['name']}: amortized result claims a distribution"
          print(f"ok: {len(d['results'])} results, {len(m['caveats'])} caveats")
          PY
        shell: bash
      - name: The README's latency table still matches the artifact it names
        # The nine-row table under "Measured performance" is one specific run,
        # and that run is a committed file. It cannot be re-derived -- absolute
        # latency depends on the host -- so the checkable property is that the
        # prose and the artifact still agree.
        #
        # This is not hypothetical. The artifact was originally committed as
        # results/benchmark_GW-X570-Taichi_20260830.json and was overwritten the
        # same day by scripts/reproduce.sh, which wrote its own run to
        # benchmark_$(hostname)_$(date +%Y%m%d).json -- the same path. The script
        # written to verify every number in the README destroyed the evidence for
        # one of them, and nothing caught it, because nothing compared prose to
        # artifacts. This step is that comparison.
        run: |
          python3 scripts/check_readme_table.py README.md \
            results/benchmark_GW-X570-Taichi_20260830_readme.json

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: /tmp/bench.json

  regression-gate:
    # What this job can and cannot assert, stated up front.
    #
    # It CANNOT tell you this commit is slower than the last one. That needs a
    # series of runs that differ only by commit, and a shared runner does not
    # provide one -- the same binary on GitHub hardware varies by more than the
    # regression worth catching. Pretending otherwise is how a performance gate
    # becomes a thing people rerun until it goes green.
    #
    # It CAN assert that the gate still works, in all three directions, and it
    # can measure the runner's own noise while doing it. A series is built
    # inside one job, so the comparison is within-session; the gate then has to
    # stay quiet on it, fire on a planted regression, and refuse a series too
    # short to judge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DTITANS_ENABLE_CUDA=OFF -DTITANS_ENABLE_TESTS=OFF
          cmake --build build --parallel --target titans_benchmark --target titans_regression
      # Pass/fail runs against the COMMITTED baseline, which is data. Asserting
      # that a series built on a shared runner comes back stationary would be
      # asserting something about the runner, and the runner does not cooperate:
      # a level shift in twenty back-to-back runs is the norm there, not a bug.
      - name: Gate is quiet on the committed no-op baseline
        run: ./build/titans_regression results/benchmark_history/local
      - name: Gate fires on a planted 25% regression
        run: |
          python3 scripts/inject_regression.py results/benchmark_history/local \
            /tmp/series_bad \
            --metric 'L2OrderBook::update_level (steady state)' --pct 25 --last 12
          set +e
          ./build/titans_regression /tmp/series_bad \
            --metric 'L2OrderBook::update_level (steady state)'
          code=$?
          set -e
          test $code -eq 6 || { echo "::error::gate did not fire (exit $code)"; exit 1; }
      - name: A series too short to judge is refused, not passed
        run: |
          mkdir -p /tmp/series_short
          ls results/benchmark_history/local/*.json | head -6 \
            | xargs -I{} cp {} /tmp/series_short/
          set +e
          ./build/titans_regression /tmp/series_short > /dev/null
          code=$?
          set -e
          test $code -eq 2 || { echo "::error::short series was not refused (exit $code)"; exit 1; }
      # And a report on the runner itself, which is the interesting part: how
      # noisy is CI hardware really? Never a failure.
      - name: Measure this runner's own noise
        run: |
          BUILD_DIR=build scripts/bench_series.sh /tmp/series 20
          set +e
          ./build/titans_regression /tmp/series
          echo "gate exit $? on a series built moments ago with no code change"
          set -e
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-series
          path: /tmp/series

  header-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Every public header compiles standalone
        run: |
          set -e
          failures=0
          for h in $(find include/titans -name '*.hpp'); do
            echo "#include \"${h#include/}\"" > /tmp/hdr_test.cpp
            echo "int main(){return 0;}" >> /tmp/hdr_test.cpp
            if ! g++ -std=c++20 -fsyntax-only -Iinclude /tmp/hdr_test.cpp 2>/tmp/err.txt; then
              echo "::error file=$h::header does not compile standalone"
              head -5 /tmp/err.txt
              failures=$((failures+1))
            fi
          done
          exit $failures

      - name: No ODR violations across translation units
        run: |
          cat > /tmp/tu1.cpp <<'EOF'
          #include "titans/context/distributed_experiment.hpp"
          #include "titans/context/ollama_backend.hpp"
          #include "titans/core/debug.hpp"
          int helper() { return 1; }
          EOF
          cat > /tmp/tu2.cpp <<'EOF'
          #include "titans/context/distributed_experiment.hpp"
          #include "titans/context/ollama_backend.hpp"
          #include "titans/core/debug.hpp"
          int helper();
          int main() { return helper() - 1; }
          EOF
          g++ -std=c++20 -Iinclude /tmp/tu1.cpp /tmp/tu2.cpp -o /tmp/odr_test -pthread
